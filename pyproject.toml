[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-pipeline"
version = "1.0.0"
description = "Metro housing affordability data pipeline and early-warning model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
model = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "optuna>=3.4",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
housing-pipeline = "housing_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
